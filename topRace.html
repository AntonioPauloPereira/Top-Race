<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/styleGame.css">
    <script src="/Js/player.js" defer></script>
    <script src="/Js/enemy.js" defer></script>
    <link rel="icon" type="image/png" href="./Images/gameIcon.png">
    <title>Top Race Game</title>
</head>
<body>
    
    <p class="points" id="score">Score: </p>
  
    <div class="control">
            <img src="/Images/Controls/Left.png" alt="" id="left">
            <img src="/Images/Controls/right.png" alt="" id="right">
    </div>

<div class="gameScreen" id="gameScreen">

    <img src="/Images/raceTrack.png" alt="" class="raceTrack">
<img src="/Images/tracks.png" alt="" class="tracks" id="tracks">
<img src="/Images/borderTrack.png" alt="" class="borderTracks" id="borderTracks">

  <p id="overtext" class="over"></p>
   <p id="press" class="press"></p>

<img src="/Images/playerCar.png" alt="" class="player" id="player">
<img src="/Images/enemyCar.png" alt="" class="enemy" id="enemy">

</div>


</body>
</html>
